<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run · Cybertron</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/run/shell.css">
<link rel="stylesheet" href="assets/run/front.css">
<link rel="stylesheet" href="assets/run/chronicle.css">
<link rel="stylesheet" href="assets/run/people.css">
<link rel="stylesheet" href="assets/run/square.css">
</head>
<body class="night run-page">
<main id="main">
  <section class="run-mast">
    <canvas class="mast-bg pixel" aria-hidden="true"></canvas>
    <div class="wrap mast-in">
      <div class="crumbs"><a href="runs.html">Runs</a> <span>/</span> <span class="spec"></span></div>
      <h1 class="run-title">Loading the village…</h1>
      <p class="standfirst"></p>
      <p class="notice" hidden></p>
    </div>
  </section>

  <!-- the run's sticky bar: its sections (as village buildings) and the day clock, shared by every section -->
  <div class="runbar" id="runbar">
    <div class="wrap">
      <nav class="secnav" aria-label="Run sections"></nav>
      <div class="clock">
        <div class="ck-day"><canvas class="moon" width="12" height="12" aria-hidden="true"></canvas>
          <div><b class="ck-n">Day 1</b><span class="ck-of"></span></div></div>
        <div class="ck-btns">
          <button class="ck-prev" title="Previous day (←)" aria-label="Previous day">‹</button>
          <button class="ck-play" title="Play the days (space)" aria-label="Play">▶</button>
          <button class="ck-next" title="Next day (→)" aria-label="Next day">›</button>
        </div>
        <div class="ck-track">
          <div class="days" role="slider" tabindex="0" aria-label="Day"></div>
          <div class="ck-rest"></div>
        </div>
        <div class="ticker" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div id="view"><p class="wrap loading-run">Waking the village…</p></div>
</main>
<div class="tip" id="tip" hidden></div>
<script type="module" src="assets/run/app.js"></script>
</body>
</html>
