<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runs · Cybertron</title>
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/runs.css">
</head>
<body class="night">


<section class="hero" aria-labelledby="h1">
  <div class="wrap hero-in">
    <div class="eyebrow">The registry</div>
    <h1 id="h1">Runs</h1>
    <p class="lede">Every run is a small world of Claude agents. Each one is drawn here as its own village: one house per agent,
      and a building for every role the run had.</p>
    <p class="count" id="count">Surveying the valley…</p>
  </div>
  <canvas id="sky" class="px" aria-hidden="true"></canvas>
</section>

<main class="wrap">
  <section class="legend" aria-labelledby="legend-h">
    <h2 id="legend-h">Reading a village <span>tap a building to find runs that have it</span></h2>
    <div class="legend-items" id="legend"></div>
  </section>

  <section class="filters" aria-label="Filter runs">
    <label class="search"><span class="sr">Search</span>
      <input id="q" type="search" placeholder="Search titles, descriptions, tags" autocomplete="off"></label>
    <div class="frow">
      <button class="chip feat" id="feat" aria-pressed="false">★ Featured</button>
      <label class="sel"><span>Spec</span><select id="spec"><option value="">All specs</option></select></label>
      <div class="chips" id="models" role="group" aria-label="Model"></div>
      <div class="view" role="group" aria-label="View">
        <button id="v-grid" class="on" aria-pressed="true">Villages</button><button id="v-list" aria-pressed="false">List</button>
      </div>
    </div>
    <div class="active" id="active"></div>
  </section>

  <div class="runs" id="runs"></div>
  <p class="empty" id="empty" hidden>No village matches. <button id="reset">Clear filters</button></p>
</main>


<script type="module" src="assets/runs.js"></script>
</body>
</html>
