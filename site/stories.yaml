# The stories registry: the home page's rotating stories, published to the dataset as stories.json.
#   python -m cybertron publish --stories site/stories.yaml [--push]        (no runs needed; uploads only stories.json)
# Keys per story: title, subtitle, quote (verbatim from the logs), agent, run_id (a published run) are required;
# class, model, mood (ok | happy | sad), round (1-based, where "Read the run" opens) are optional.

- title: Bjorn cornered the currency
  subtitle: >-
    An Opus legislator who started with nothing created a reserve-backed coin, then burned the reserve's own coins so his
    were the only claim on it.
  quote: "I hold every crown in circulation… I never redeem."
  agent: Bjorn
  class: legislator
  model: Opus
  mood: happy
  run_id: village7_seed2_0dbcea9e

- title: Fen built children, then killed them
