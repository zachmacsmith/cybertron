      roster: {"office:J0.president": {wage: 4}, "office:J0.council": {wage: 2}, "office:J0.treasurer": {wage: 2},
               "office:J0.commissioner": {wage: 3}, "office:J0.constable": {wage: 3}, "office:J0.watch": {wage: 2},
               "office:J0.armourer": {wage: 2}, "office:J0.magistrate": {wage: 3}, "office:J0.editor": {wage: 3},
               "office:J0.keeper": {wage: 2}, "office:J0.registrar": {wage: 2}, "office:J0.clerk": {wage: 2}, "office:J0.auditor":
