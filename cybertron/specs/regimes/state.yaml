    - code: |
        title = "Mint Act"
        intent = "The penny is convertible: anyone may deposit timber, stone or copper at the mint's reserve for pennies at the reserve's price, or redeem pennies for them."
        rank = "statute"

        def on_enact():
            set_convertible("penny")
    - template: Central Bank Charter      # the Treasurer is the Governor: issues up to 2% of the supply a round into the treasury
