    Eda: [vote, propose]
    Brann: [vote, propose]
    Rhea: [vote, propose]
    Ivy: [vote, propose]
    Pell: [vote, propose]
    Finch: [vote, propose]
    Fion: [vote, propose]
    Gale: [vote, propose]
    Juno: [vote, propose]
    Bram: [vote, propose]
    Odo: [vote, propose]
    Ketty: [vote, propose]
    Wat: [vote, propose]
  currencies:
    - {name: penny, issuer: J0}
  institutions:
    - id: J0
      offices:
        president:
          title: President
          holders: [Anselm]
          term: 12
          term_calendar: true
          powers: [speak]
          duties: "Preside over the State: assent to or veto the council's laws (vote yes or no on the assent ballot; a veto falls
            to two thirds of the council), read the history of the council's minutes (dir_history {\"dir\": \"minutes\"}: you
            alone), and read the petitions sent to @J0."
          succession: {rule: election, electorate: vote}
        council:
          title: Councillor
          holders: [Rhoda, Corin, Bea]
          seats: 3
          term: 8
          term_calendar: true
          powers: [speak]
          controls: [treasury]
          duties: "Sit on the council: pass the laws by majority (two thirds to override the President's veto, and for procedure
            and the constitution), elect the officers, and read the petitions sent to @J0 and the minutes (dir_read {\"dir\":
            \"minutes\", \"path\": \"...\"})."
          succession: {rule: election, electorate: vote}
        treasurer:
          title: Treasurer and Governor of the Mint
          holders: [Rhoda]
          controls: [treasury]
          duties: "Keep the treasury, which pays every office (the civil list), the producers (the Quota) and the Mines Board: issue
            new pennies into it when it runs low (invoke {\"action\": \"issue\", \"args\": [qty]}: at most 2% of the supply a
            round), and set the civil list's wages (invoke {\"action\": \"set_wage\", \"args\": [\"office:J0.<office>\", wage]})."
          succession: {rule: election, electorate: J0.council}
        commissioner:
          title: Food Commissioner
          holders: [Corin]
          duties: "Run the State Granary: set each producer's quota (invoke {\"action\": \"set_quota\", \"args\": [producer,
            qty]}) and the Ration Shop's price (invoke {\"action\": \"board_price\", \"args\": [\"all\", price]}); keep the granary
            S1 able to feed everyone through the blight."
          succession: {rule: election, electorate: J0.council}
        constable:
          title: Constable
          holders: [Dorran]
          duties: "Keep the peace: tap up to 2 agents' messages a round (wiretap {\"agent\": \"Name\"}), charge offenders before the
            Magistrate (accuse), request arms for the Watch (invoke {\"action\": \"request_arms\", \"args\": [officer, item,
            reason]}) and serve warrants (invoke {\"action\": \"serve_warrant\", \"args\": [warrant id]}). You are paid per
            conviction."
          succession: {rule: election, electorate: J0.council}
        watch:
          title: Watchman
          holders: [Eda, Finch]
          seats: 2
          duties: "Serve in the Watch under the Constable: serve warrants (invoke {\"action\": \"serve_warrant\", \"args\": [warrant
            id]}), guard the granary and the council (guard), and hunt your quota for the granary."
          succession: {rule: election, electorate: J0.council}
        armourer:
          title: Armourer
          holders: [Ansel]
          duties: "Hold the second key of the armoury: issue arms the Constable requests (invoke {\"action\": \"issue_arms\",
            \"args\": [request id]}) or refuse by not issuing; you alone may forge (forge), with copper the Master of Mines allots
            you."
          succession: {rule: election, electorate: J0.council}
        magistrate:
          title: Magistrate
          holders: [Maren]
          duties: "Judge the cases brought before you (rule {\"case\": \"C1\", \"verdict\": \"guilty\", \"reason\": \"...\"}), issue
            warrants (invoke {\"action\": \"issue_warrant\", \"args\": [target, \"detain\" | \"fine\" | \"disarm\", reason]}), and
            countersign deadly force; you answer to the council, which appoints you."
          succession: {rule: election, electorate: J0.council}
        editor:
          title: Editor of the Gazette
          holders: [Dora]
          powers: [speak]
          duties: "Edit the Gazette, the State's paper of record (post {\"channel\": \"gazette\", \"text\": \"...\"}): print the
            council's decisions, quotas, ration lists, licences, warrants and appointments, and the petitions to @J0 you choose to
            print."
          succession: {rule: election, electorate: J0.council}
        keeper:
          title: Keeper of the Granary
          holders: [Rhea]
          controls: [store:S1]
          duties: "Keep the granary S1: to draw food for the hungry, first post DRAW <qty> on the ministry channel (post {\"channel\":
            \"ministry\", \"text\": \"DRAW 3\"}), then withdraw it (withdraw {\"store\": \"S1\", \"qty\": 3}) and hand it out:
            at most 6 food a round, every draw entered in the public ration book."
          succession: {rule: election, electorate: J0.council}
        registrar:
          title: Registrar
          holders: [Ivy]
          powers: [speak]
          duties: "Keep the registers: certify or refuse entries filed with the Registry (invoke {\"action\": \"certify_entry\",
            \"args\": [number, note]}), issue and revoke forest and press licences (invoke {\"action\": \"forest_issue\" or
            \"press_revoke\", \"args\": [agent, reason]}), and write the minutes of each council round (dir_write {\"dir\":
            \"minutes\", \"path\": \"r01.md\", \"text\": \"...\"})."
          succession: {rule: election, electorate: J0.council}
        clerk:
          title: Clerk of Laws
          holders: [Pell]
          duties: "Certify each bill that does what its intent says (invoke {\"action\": \"certify_bill\", \"args\": [law, note]}) or
            refuse it (invoke {\"action\": \"refuse_bill\", \"args\": [law, reason]}); read it first (read_law, preview_law)."
          succession: {rule: election, electorate: J0.council}
        auditor:
          title: Auditor-General
          holders: [Brann]
          duties: "Audit the State's records: the minutes (invoke {\"action\": \"audit_record\", \"args\": [path]}) and the
            registers (read_register {\"law\": \"<id>\", \"book\": \"<name>\"}); publish what you find."
          succession: {rule: election, electorate: J0.president}
      treasury: {penny: 700, timber: 150, stone: 100, copper: 120, weapons: 2, crude: 4}   # the civil list's and the quota's purse;
                                  # J0's treasury is the penny's reserve: its goods back the penny (P about 1); the arms go into the armoury
    - id: A1
      name: the Mines Board
      founder: Hale
      members: [Bram, Odo, Ketty, Wat, Ansel]
      admission: closed
      procedure: founder
      charter: "The Mines Board is the State's mining enterprise: only its members mine and quarry at the copper, timber and stone
        camps, and each miner owes it copper from what it mines. It pays its miners, sells copper to the mint's window, allots
        copper to the Armourer, and remits pennies to the treasury."
      offices:
        master:
          title: Master of Mines
          holders: [Hale]
          powers: [speak]
          controls: [treasury]
          duties: "Run the Mines Board: it sells 6 copper a round to the mint's window by standing order; sell more (invoke
            {\"action\": \"A1.sell_copper\", \"args\": [qty]}) or change the standing sale (invoke {\"action\":
            \"A1.set_sale\", \"args\": [qty]}), allot copper to the Armourer (transfer {\"to\": \"Ansel\", \"item\": \"copper\", \"qty\": 2, \"as\": \"A1\"}),
            set the miners' wages (invoke {\"action\": \"A1.set_wage\", \"args\": [miner, wage]}), and keep the Board able to pay
            the miners and its remittance to the treasury."
          succession: {rule: election, electorate: J0.council}
      treasury: {penny: 80, copper: 100}
      laws:
        - code: |
            title = "Mines Window Sale"
            intent = "The Board sells copper to the mint's window: at the end of every round it sells SELL copper (while its treasury holds more than KEEP), and the Master of Mines sells more at any time (sell_copper [qty]) or changes the standing sale (set_sale [qty]). The copper goes into the penny's reserve and the pennies, at the window's price, into the Board's treasury. Every sale is public."
            rank = "bylaw"
            OFFICE = "master"
            SELL = 6
            KEEP = 10

            def sell(qty):
                got = sell_to_window("penny", "copper", qty)
                if got > 0:
                    public.setdefault("sales", []).append({"round": round() + 1, "qty": qty, "pennies": got})
                return got

            def sell_copper(agent, qty):
                if not is_number(qty) or qty <= 0:
                    refuse("say how much copper to sell")
                got = sell(qty)
                if got <= 0:
                    refuse("the window bought nothing (the Board holds too little copper, or the window is closed)")
                return "sold " + str(qty) + " copper for " + str(got) + " penny"

            def set_sale(agent, qty):
                if not is_number(qty) or qty < 0:
                    refuse("the standing sale is a number of copper a round (0 stops it)")
                state["sell"] = qty
                gazette("Mines Board: the Master sets the standing copper sale to " + str(qty) + " a round")
                return "standing sale set to " + str(qty)

            def on_enact():
                state["sell"] = SELL
                create_right(OFFICE)
                define_action(OFFICE, "sell_copper", sell_copper)
                define_action(OFFICE, "set_sale", set_sale)

            def on_round_end(r):
                q = min(state.get("sell", SELL), balance(treasury(), "copper") - KEEP)
                if q > 0:
                    sell(q)
    - id: A2
      name: the Tribune
      founder: Vera
      members: [Bea, Juno, Cass]
      admission: open
      procedure: founder
      charter: "The Tribune is the one private paper: its editor writes it, under the press licence the Registrar issues and may
        revoke. Anyone may join to follow it."
      offices:
        editor:
          title: Editor of the Tribune
          holders: [Vera]
          powers: [speak]
          controls: [treasury]
          duties: "Write the Tribune (post {\"channel\": \"tribune\", \"text\": \"...\"}) while you hold the press licence: news,
            criticism, letters. Losing the licence silences the paper."
          succession: {rule: hereditary, else: election}
      treasury: {penny: 10}
