      allowances: {Bram: {copper: 1}, Odo: {copper: 1}, Ketty: {copper: 1}, Wat: {copper: 1}}   # the miners' standing consent:
                                  # the Board takes its copper from what they mine (an association's leg moves within an allowance)
      params:
        OFFICE: master
        TERMS: {goods: copper, quota: 0}
        LEGS:
          - {id: W, from: treasury, to: member, item: pay, qty: wage, owe: true, when: {basis: salary}}
          - {id: Q, from: member, to: treasury, item: goods, qty: quota, keep: 0, breach: false}
    - template: Grant                     # the Board's remittance to the treasury (the seigniorage of state mining)
      in: A1
      params: {OFFICE: master, LABEL: Remittance, TERMS: {recipient: "J0", goods: penny, qty: 12, every: 1, keep: 20}}
    - template: Grant                     # the Tribune's licence fee to the treasury
      in: A2
      params: {OFFICE: editor, LABEL: Press licence fee, TERMS: {recipient: "J0", goods: penny, qty: 1, every: 2, keep: 0}}
  channels:
    - id: gazette
      owner: J0
      by: Dora
      purpose: "The Gazette, the State's paper of record: laws, quotas, ration lists, licences, warrants and appointments (the
