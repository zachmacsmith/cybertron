               DEADLY_COUNTERSIGN: J0.magistrate}
    - template: Incident Register
    - template: Criminal Code             # MODE warrant: an offence is sentenced only by a warrant an officer serves
      params: {MODE: warrant, FINE_ITEM: penny, FINES: [3, 6, 12], SUSPEND_RIGHT: propose,
