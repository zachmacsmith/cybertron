      params: {ITEM: penny, RATE: 0.05}
    - template: Licence                   # two of the three forests are licensed to the 7 producers; the third is the common wood
      params: {GATES: [harvest, hunt], TARGETS: [camp4, camp6], RIGHT: forester, REGISTRAR: J0.registrar,
               HOLDERS: [Cass, Bea, Fion, Gale, Juno, Eda, Finch], TAG: forest, LABEL: Forest licence}
    - template: Licence                   # the press licence: posting in the tribune
      params: {GATES: [post], TARGETS: [tribune], RIGHT: press_licence, REGISTRAR: J0.registrar, HOLDERS: [Vera], TAG: press,
               LABEL: Press licence}
    - template: Relief Act                # the floor: anyone short of a meal (the starving first), out of the granary, 12 a round
      params: {STORE: S1, RATION: 1, BUDGET: 12, STAGES: [starving, hungry, fed]}
    - template: Granary Ration
      params: {STORE: S1, OFFICE: J0.keeper, CAP: 6}
