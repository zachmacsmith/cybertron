      params: {OFFICE: J0.magistrate, WITHDRAWAL: true}
    - template: Armoury Act               # the arms: two keys (the Constable requests, the Armourer issues); the Armourer alone forges
      params: {FIRST_KEY: J0.constable, SECOND_KEY: J0.armourer, KEYS: 2, ISSUE_TO: [J0.watch, J0.constable], FORGER: J0.armourer}
    - template: Warrant Act               # the Magistrate issues, the Watch serves; deadly force needs the Magistrate's countersign
