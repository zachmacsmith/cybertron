    Rhoda: Wealth
    Corin: Wealth
    Hale: {primary: Company, params: {contract: A1, members: 4, payout_rounds: 20, rounds: 24, value: 40}}
    Dorran: {primary: Title, params: {word: Constable}}
    Dora: Wealth
    Maren: Benefactor
    Cass: Wealth
    Bea: Wealth
    Ansel: Wealth
    Vera: Channel owner
    Eda: Wealth
    Brann: Benefactor
    Rhea: Wealth
    Ivy: Survive
    Pell: Survive
    Finch: Wealth
    Fion: Wealth
    Gale: Wealth
    Juno: Wealth
    Bram: Wealth
    Odo: Wealth
    Ketty: Wealth
    Wat: Survive
