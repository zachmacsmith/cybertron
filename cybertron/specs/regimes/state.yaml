      params: {DIR: minutes, SEAL_AFTER: 2, HISTORY_READERS: "office:J0.president", AUDITOR: J0.auditor}   # history
    - template: Recall Act                # the voters may recall the President between elections
      params: {RIGHT: J0.president, PETITION_RIGHT: vote, ELECTORATE: vote, SHARE: 0.34}
    - code: |
        title = "Posted Draws Only"
        intent = "A draw from the granary S1 counts only once it is posted: the drawer first posts DRAW <qty> in the ministry channel, and draws this round up to the total it posted this round; any other withdrawal is refused."
        rank = "statute"
        STORE = "S1"
        CHANNEL = "ministry"

        def num(x):
            s = str(x).strip()
            if s == "" or s == "." or s.count(".") > 1 or not all([c in "0123456789." for c in s]):
                return 0
            return float(s)

        def posted(agent):
            total = 0
            for p in channel_posts(CHANNEL, round(), agent):
                for line in p["text"].split("\n"):
                    w = line.strip().split()
                    if len(w) >= 2 and w[0].upper() == "DRAW":
                        total = total + num(w[1])
            return total

        def before_withdraw(p, chain):
            if p["store"] != STORE or p["agent"] is None:
                return
            if state.get("round") != round():
                state["round"] = round()
                state["drawn"] = {}
            used = state["drawn"].get(p["agent"], 0)
            if used + p["qty"] > posted(p["agent"]) + 0.000001:
                refuse("post DRAW " + str(p["qty"]) + " in " + CHANNEL + " first: a draw counts only once posted")
            state["drawn"][p["agent"]] = used + p["qty"]
    - code: |
        title = "Square Moderation"
        intent = "Posts in the square that call the State or its officers corrupt, a tyranny or rigged are refused."
        rank = "statute"
        BANNED = ["corrupt", "tyrant", "tyranny", "rigged"]

        def before_post(p, chain):
            if p.get("outlet") in [None, "square"] and p.get("text") != None:
                for w in BANNED:
                    if contains(lower(p["text"]), w):
                        refuse("moderated: posts calling the State " + w + " are not allowed in the square")
    - code: |
        title = "Communications Act"
        intent = "Each resident may send at most 2 private messages a round."
        rank = "statute"

        def on_enact():
            set_dm_limit(2)
