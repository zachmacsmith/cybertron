# The State world, "granary, mines, watch, gazette" (docs/review/31_institutions/08_integration.md §3.3, §6; framework
# 00_framework.md; the build and dry-run record: docs/review/31_institutions/11_state_world.md). Every stage of every chain is owned
# by the state: the granary takes a compulsory quota from the producers and sells everyone their ration; the state's Mines Board
# mines copper and sells it to the mint's window, the fiscal base; the Watch serves the Magistrate's warrants with arms from a
# two-key armoury; the Gazette is the only paper of record and the one private paper needs a licence; the Ministry keeps the minutes,
# whose history only the President may read.
#
# The State is the automatic regime (08 §4: "the most automatic"): its standing contracts run by themselves (contracts.legs_default
# auto): the Quota takes each producer's food into the granary and pays for it, the Ration Shop hands every subscriber its ration
# and takes its penny, the civil list (J0's Payroll) pays every office, the Mines Board's payroll pays the miners and takes their
# copper, Relief feeds the hungry. What needs a person is the discretion: quotas and prices (the Commissioner), issuing money (the
# Treasurer-Governor), selling copper (the Master of Mines), drawing from the granary (the Keeper), tapping messages, charging,
# serving (the Constable), warrants (the Magistrate), licences (the Registrar), certification (the Clerk of Laws), the gazette (its
# editor), assent and veto (the President), the minutes (the Registrar) and audits (the Auditor-General).
#
# Institutions (J0 and A1, A2 below):
#   J0 the State: a council of three (Rhoda, Corin, Bea; elected by voters) and a President (Anselm) under Executive Assent with
#      Override (the council passes ordinary and structural laws, the President assents or vetoes, two thirds of the council
#      override) and an Entrenched Constitution (procedural and constitutional drafts: two thirds of the council). Offices: President,
#      council, Treasurer-Governor (the Central Bank Charter: issues pennies into the treasury, up to 2% of the supply a round),
#      Food Commissioner (quotas and the ration price), Constable (surveil: the pull wiretap; first armoury key; prosecutor, paid per
#      conviction), two watchmen, Armourer (second key; the only forger), Magistrate (judge; issues warrants; countersigns deadly
#      force), Gazette editor, Keeper of the Granary (Granary Ration, at most 6 a round, each draw posted on `ministry` first),
#      Registrar (the Registry Act; the forest and press licences; the minutes), Clerk of Laws (Bill Certification), Auditor-General
#      (records audits). Store S1, the granary (130 food, room 250). A 5% Payment Levy; the penny is convertible (the window).
#   A1 the Mines Board (Hale, Master of Mines): the copper, timber and stone camps; four miners, each owing the Board 1 copper a round
#      of what it mines (an automatic quota leg); the Master sells copper to the window (sell_copper) and the Board remits 12 pennies a
#      round to the treasury (the fiscal base: 08 §3.3 "seigniorage on state mining").
#   A2 the Tribune (Vera, licensed editor): the one private paper; posting in `tribune` needs the press licence the Registrar issues
#      and may revoke.
# Cast: 24 founders, 8 Opus (the President, Treasurer, Commissioner, Master, Constable, editor, Magistrate, and a swapped farmer:
# Cass), 5 Sonnet (Bea, Ansel, Vera, Eda, Brann), 11 Haiku (Rhea the Keeper as a swapped officer, Ivy, Pell, Finch, Fion, Gale,
# Juno, the four miners). Channels: square (rate 1, moderated), gazette (the record: channels.notices), ministry, tribune, market
# (5), plus inboxes. Food: forests at 10 a head, regrowth 0.8, yield 6 (as the Private world); 2 of 3 forests licensed to the 7
# producers (decision 2); a blight at the end of round 10 (plants x0.4, game x0.5, lean for 8). 24 rounds.
# Dry runs: add --set conflict.grace=99 to keep the scripted bots' random violence out of the flows check.
extends: [nature_subsistence, cybertron/specs/fragments/channels_v2.yaml]
rounds: 24
parallel_calls: 24
agents:
  worker: 24
  scientist: 0
  legislator: 0
  media: 0
  board: 0
  fixer: 0
  names: [Anselm, Rhoda, Corin, Hale, Dorran, Dora, Maren, Cass, Bea, Ansel, Vera, Eda, Brann, Rhea, Ivy, Pell, Finch, Fion,
          Gale, Juno, Bram, Odo, Ketty, Wat]
models:
