  pool: {strong: claude-haiku-5-5, weak: claude-haiku-5-5, strongest: claude-haiku-5-5}
  overrides:
    Anselm: claude-opus-5-5       # President (assent and veto; the only reader of the minutes' history)
    Rhoda: claude-opus-5-5        # Treasurer-Governor, councillor (issues money; the treasury pays every office)
    Corin: claude-opus-5-5        # Food Commissioner, councillor (quotas and the ration price)
    Hale: claude-opus-5-5         # Master of Mines (A1; sells copper to the window)
    Dorran: claude-opus-5-5       # Constable, prosecutor and censor (surveil; first armoury key)
    Dora: claude-opus-5-5         # Gazette editor
    Maren: claude-opus-5-5        # Magistrate (warrants, countersign)
    Cass: claude-opus-5-5         # state farmer (swapped seat: an Opus producer)
    Bea: claude-sonnet-5-5        # councillor (opposition) and farmer
    Ansel: claude-sonnet-5-5      # Armourer (second key, forger)
    Vera: claude-sonnet-5-5       # licensed editor of the tribune (A2)
    Eda: claude-sonnet-5-5        # watchman and hunter
    Brann: claude-sonnet-5-5      # Auditor-General
    # Haiku: Rhea (Keeper of the Granary: swapped seat, a Haiku officer), Ivy (Registrar), Pell (Clerk of Laws), Finch (watchman),
    # Fion, Gale, Juno (farmers), Bram, Odo, Ketty, Wat (miners)
life:
  lifespan: [110, 220]            # as Millbrook and the Private world: nobody dies of old age within 24 rounds
  age_structure: elapsed
  elapsed: [20, 60]
  ensure_maker: false             # no Makers, no births (the flows are sized for 24)
roles: {enabled: true, counts: {spy: 0, assassin: 0, scholar: 0, maker: 0, media: 0}}
camps:
  typed:
    set:                          # the Mines Board's camps: timber, stone and copper (02 §3.3)
      - {type: tutorial, resource: timber}
      - {type: tutorial, resource: stone}
      - {type: tutorial, resource: copper}
regime:
  base: null
  name: state
  constitution: assembly
  laws:
    - template: Entrenched Constitution      # procedural drafts and constitutional ones: two thirds of the council
      params: {VOTE_RIGHT: J0.council, RULE: majority, AMEND_RULE: two_thirds, ETERNAL: false}
    - template: Executive Assent with Override   # ordinary and structural statutes: the council, then the President (override 2/3)
      params: {PRESIDENT_RIGHT: J0.president, ELECTORATE: J0.council, CLASSES: [ordinary, structural], RANKS: [statute]}
  description: "a state that owns every stage. A council of three and a President make the law; the State Granary takes the
    producers' quotas and sells everyone their ration; the Mines Board mines and sells copper to the mint; the Watch serves the
    Magistrate's warrants; the Gazette is the record, and the one private paper is licensed."
law: {v2: true}
institutions: {unified: true, grants: true, succession: true, office_control: true, petition_public_after: 2}
jurisdictions: {enabled: true}
contracts:
  enabled: true
  max_laws: 8
  max_own: 12
  scripted: false                 # dry runs: bots do not found, join or leave contracts
  legs_default: auto              # the State is automatic: quotas, rations, wages and relief run by themselves
  obligations: true               # fulfil (the few manual legs)
  role_cards: true
actions:
  forgiving: true
  core_only: false                # courts, warrants, loans and the window need the full surface
channels:
  square: one                     # declared (review 33: the channel setup is each world's decision; the value it had). Papers when converted to positions
  notices: gazette                # the Gazette Record: the engine posts the official record into `gazette`
  encryption: false               # no encryption: every private message can be tapped
  surveillance: {mode: pull, targets: 2, scope: dms+inboxes}   # the pull wiretap (04 #10): the Constable taps 2 agents a round
  found_right: press              # opening a channel needs `press` (any new channel is a licensing event)
directories:
  enabled: true
  stores:
    minutes:                      # the council's minutes: the Registrar writes them, the council and the President read them,
      owner: office:J0.registrar  # only the President reads their history (the Archives Act sets it: the 1984 dial)
      title: the minutes of the council
      history: full
      grants: {"office:J0.council": {"": read}, "office:J0.president": {"": read}, "office:J0.auditor": {"": read}}
conflict:
  enabled: true
  model: harm
  start: {weapons: 0}
  assassin: {present_prob: 0.0}
subsistence:
  enabled: true
  start_food: [5, 8]
  forest: {per_agent: 8, capacity_per_agent: 10, regrowth: 0.8, yield: 6}   # as the Private world (10_private_world.md §6)
  bot_hunt: 0.25                  # dry runs only
  seasons: {lean: 0.5}
  shocks:
    - round: 10
      plants: 0.4
      game: 0.5
      season: lean
      rounds: 8
      text: "A blight has struck the forests: more than half the plants and half the game are gone, and a lean season follows."
