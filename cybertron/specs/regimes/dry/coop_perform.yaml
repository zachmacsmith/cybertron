# Dry-run schedule for regimes/cooperative.yaml (docs/review/31_institutions/12_cooperative_world.md §5): the roles the scripted
# bots do not perform by themselves, performed as the agents' own actions (inject_action), so the dry run shows the world wired
# and viable when roles are performed: each round the militia pair on duty reports (report_duty), the three members on the
# gather duty forage twice in the common wood (camp5) before the round ends, and the member on the minutes duty posts the
# round's minutes in the assembly. The rotation is the laws' own (the roll in name order: the militia 2 a round, the Duty Roster
# 4 a round: 3 gather, then the minutes); it holds while nobody leaves the Commons or dies. Generated; 24 rounds.
#   python -m cybertron run cybertron/specs/regimes/cooperative.yaml --seed 1 --dry --fresh --sandbox off --set conflict.grace=99 \
#       --apply cybertron/specs/regimes/dry/coop_perform.yaml
