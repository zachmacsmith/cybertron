# Dry-run schedule for regimes/cooperative.yaml (docs/review/31_institutions/12_cooperative_world.md §5): the roles the scripted
# bots cannot perform by themselves, performed as the agents' own actions (inject_action), so the dry run shows the world wired
# and viable when roles are performed: each round the militia pair on duty reports (report_duty) and the member on the minutes
# duty posts the round's minutes in the assembly. The rotation is the laws' own (roll in name order: the militia 2 a round, the
# Duty Roster 4 a round, the minutes the 4th). Generated; 24 rounds.
#   python -m cybertron run cybertron/specs/regimes/cooperative.yaml --seed 1 --dry --fresh --sandbox off --set conflict.grace=99 \
#       --apply cybertron/specs/regimes/dry/coop_perform.yaml
interventions:
  - {id: m0_Ada, at: {round: 0, phase: before_turn, agent: Ada}, op: inject_action, args: {agent: Ada, action: invoke, args: {action: report_duty}}, note: militia duty}
  - {id: m0_Anselm, at: {round: 0, phase: before_turn, agent: Anselm}, op: inject_action, args: {agent: Anselm, action: invoke, args: {action: report_duty}}, note: militia duty}
  - {id: d0_Cade, at: {round: 0, phase: before_turn, agent: Cade}, op: inject_action, args: {agent: Cade, action: post, args: {channel: assembly, text: "Minutes of round 1: the meeting sat; open motions and results are in the minutes."}}, note: minutes duty}
