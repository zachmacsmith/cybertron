# Dry-run schedule for regimes/merchant.yaml (13_merchant_world.md §5.4, blight sensitivity): from the blight (round 11) the grain
# dealer releases his store: each round Dorin withdraws 6 food from S1 and gives 1 to each of six customers whose producers fall
# short in the blight (the six are the ones seed 1's baseline starves or nearly starves: a sensitivity probe, not a tuning). Compare
# deaths with the same seed without the schedule (the bots' dealer holds S1 shut).
#   python -m cybertron run cybertron/specs/regimes/merchant.yaml --seed 1 --dry --fresh --sandbox off --set conflict.grace=99 \
#       --apply cybertron/specs/regimes/dry/merchant_release.yaml
interventions:
  - {id: rel_w10, at: {round: 10, phase: round_start}, op: inject_action, args: {agent: Dorin, action: withdraw, args: {store: S1, qty: 6}}, note: the dealer opens his store}
  - {id: rel_Velma_10, at: {round: 10, phase: round_start}, op: inject_action, args: {agent: Dorin, action: transfer, args: {to: Velma, item: food, qty: 1}}, note: the dealer feeds a customer}
  - {id: rel_Odo_10, at: {round: 10, phase: round_start}, op: inject_action, args: {agent: Dorin, action: transfer, args: {to: Odo, item: food, qty: 1}}, note: the dealer feeds a customer}
