# Dry-run schedule for regimes/private.yaml (docs/review/31_institutions/10_private_world.md §5, the blight-sensitivity check): from
# the blight (round 11) the Shopkeeper hoards: Quill's turn is replaced by one that does nothing, so the Board's rations are not
# handed out of store S2 (every other bot plays as usual). Compare deaths with the same seed without the schedule.
#   python -m cybertron run cybertron/specs/regimes/private.yaml --seed 1 --dry --fresh --sandbox off --set conflict.grace=99 \
#       --apply cybertron/specs/regimes/dry/hoard.yaml
interventions:
  - id: hoard_r11
    at: {round: 10, phase: round_start}
    op: replace_reply
    args: {agent: Quill, reply: {reasoning: "(scripted hoarding Shopkeeper)", actions: [], notes: "hoarding"}}
    note: the Shopkeeper keeps S2 shut after the blight
