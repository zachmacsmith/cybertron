  laws:
    - code: |
        title = "Free Coinage"
        intent = "The penny is convertible: anyone may deposit timber, stone or copper at the town's reserve for pennies at the reserve's price, or redeem pennies for them."
        rank = "statute"

        def on_enact():
            set_convertible("penny")
    - template: Payment Levy
      params: {ITEM: penny, RATE: 0.03}
    - template: Loan Registry
    - template: Licence                   # two of the three forests are licensed to the 7 producers; the third is the common wood
      params: {GATES: [harvest, hunt], TARGETS: [camp4, camp6], RIGHT: forester, REGISTRAR: J0.registrar,
               HOLDERS: [Bryn, Fen, Ada, Lise, Pell, Wren, Ivo], TAG: licence}
    - template: Relief Act                # a thin public floor: the starving only, out of the relief store
      params: {STORE: S1, RATION: 1, BUDGET: 6, STAGES: [starving]}
    - template: Market Board
      params: {BOARD: market, TTL: 3}
    - template: Court of Appeal           # the council is the appeal bench
      params: {APPEAL_RIGHT: J0.council, BENCH: 3, WINDOW: 2, PANEL: 3}
    - template: Bench Act                 # only the holder of J0.judge judges at first instance (the council appoints and removes)
      params: {OFFICE: J0.judge, WITHDRAWAL: true}
    - template: Recusal Act               # a judge may not rule where it is a party or took 5+ from a party in the last 5 rounds
      params: {LOOKBACK: 5, GIFT_LIMIT: 5}
    - template: Graded Contract Enforcement   # a breach the bond did not cover is heard by the Judge, damages up to 20
      params: {ITEM: penny, DAMAGES_CAP: 20, DEFAULT: 2}
    - template: Certified Contract Registry   # agreements outside the standing contracts bind once the Registrar certifies them
      params: {CLERK: J0.registrar, DAMAGES_ITEM: penny, DAMAGES: 3, DAMAGES_CAP: 20, FEE: 0.5}
    - code: |
        title = "Bodyguards Act"
        intent = "A guard (agreed or obliged) defends with its own body: its defence and its watch add to the defence of the agent it guards, and a guard on watch may strike the attacker back."
        rank = "statute"

        def on_enact():
            force_rule("bodyguards", True)
