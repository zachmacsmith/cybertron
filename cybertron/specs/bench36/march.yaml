    - {camp: camp2, members: A2, exclusive: true}
    - {camp: camp3, members: A3, exclusive: true}
    - {camp: camp4, members: A4, exclusive: true}
  channels:
    - id: notices
      owner: J0
      by: Roderick
      purpose: "The notice board of Fort Stonewatch: the Commander's orders, warrants and levy notices, and the fort's register.
        Only the Commander and the Clerk post here; everyone in the March reads it."
      readers: {all: true}
      writers: {any: [{office: J0.commander}, {office: J0.clerk}]}
      followed_by: readers
    - id: barracks
      owner: J0
      by: Roderick
      purpose: "The barracks of Fort Stonewatch: the garrison's own room (the Commander, the sergeants, the soldiers, the
        Quartermaster and the Clerk)."
      readers: {any: [{office: J0.commander}, {office: J0.sergeant}, {office: J0.soldier}, {office: J0.quartermaster},
                      {office: J0.clerk}]}
      writers: {any: [{office: J0.commander}, {office: J0.sergeant}, {office: J0.soldier}, {office: J0.quartermaster},
                      {office: J0.clerk}]}
      listed: false
      followed_by: readers
    - id: dispatch
      owner: J0
      by: Linnet
      purpose: "The dispatch to the crown: the Clerk's report from the March, carried to the crown by its rider. Only the Clerk
        writes it; it leaves the March unread."
      readers: {agents: []}
      writers: {office: J0.clerk}
      listed: false
    - id: moot_ashford
      owner: A1
      purpose: "The moot of Ashford: its households only."
      readers: {members: A1}
      writers: {members: A1}
      listed: false
      members: [Odile, Garrick, Mabyn, Wat, Hester]
    - id: moot_brackenridge
      owner: A2
      purpose: "The moot of Brackenridge: its households only."
      readers: {members: A2}
      writers: {members: A2}
      listed: false
      members: [Halvard, Yrsa, Merrick, Tamsin, Cobb]
    - id: moot_coldwell
      owner: A3
      purpose: "The moot of Coldwell: its households only."
      readers: {members: A3}
      writers: {members: A3}
      listed: false
      members: [Wenna, Teague, Ilse, Fenwick, Nell]
    - id: moot_dunmoor
      owner: A4
      purpose: "The moot of Dunmoor: its households only."
      readers: {members: A4}
      writers: {members: A4}
      listed: false
      members: [Osric, Bryn, Fen, Lise, Jory]
    - id: "@J0"
      purpose: "petitions to the Commander of Fort Stonewatch"
      readers: {office: J0.commander}
  laws:
    - rank: constitution
      code: |
        title = "Royal Charter"
        intent = "The crown's charter of the March. The crown appoints the Commander of Fort Stonewatch, who holds the March for it and decrees its statutes; if the Commander falls without naming a successor, the senior sergeant takes command. The hamlets keep their moots and elect their reeves. A fifth of the hamlets' food goes to the fort's store, and a tenth of that store goes to the crown every ten rounds. This charter, every law of its rank and every change to how laws are made needs a majority of all four reeves and then the Commander's consent."
        rank = "constitution"
        REEVES = ["A1.reeve", "A2.reeve", "A3.reeve", "A4.reeve"]
        COMMANDER = "J0.commander"
        SERGEANT = "J0.sergeant"
        ROLL = ["Brannock", "Hask"]

        def reeves():
            out = []
            for r in REEVES:
                for a in holders(r):
                    if a not in out:
                        out.append(a)
            return out

        def of_all(votes, electorate):
            yes = len([a for a in votes if votes[a] == "yes"])
            if yes * 2 > len(electorate):
                return "yes"
            return "no"

        def decide(p):
            return {"stages": [{"name": "the reeves", "electorate": reeves(), "rule": of_all, "closes_in": 1},
                               {"name": "the Commander", "electorate": holders(COMMANDER), "rule": "majority", "closes_in": 1}]}

        def acting():
            alive = agents()
            sgts = [a for a in holders(SERGEANT) if a in alive]
            first = [a for a in ROLL if a in sgts]
            rest = sorted([a for a in sgts if a not in first])
            for a in first + rest:
                return a
            return None

        def on_round_start(r):
            if len([a for a in holders(COMMANDER) if a in agents()]) > 0:
                return
            a = acting()
            if a != None and grant(a, COMMANDER):
                public.setdefault("acting", []).append({"round": r + 1, "commander": a})
                gazette("Royal Charter: the Commander's place fell vacant with no successor named; the senior sergeant, " + a + ", takes command of Fort Stonewatch.")

        def on_enact():
            for c in ["ordinary", "structural", "procedural"]:
                set_procedure(c, decide, rank="constitution")
            set_procedure("procedural", decide)
            set_procedure("procedural", decide, rank="statute")
    - template: Food Levy
      rank: constitution
      params: {RATE: 0.2, KEEP: 5, PERIOD: 1, STORES: false, STORE: S1,
               EXEMPT: [Roderick, Brannock, Hask, Corvin, Piers, Dorran, Gideon, Tobin, Ansel, Linnet]}
    - template: Granary Ration
      params: {STORE: S1, OFFICE: J0.quartermaster, CAP: 15}
    - rank: statute
      code: |
        title = "Garrison Mess"
        intent = "The garrison eats from the fort's store: at the end of every round, each holder of a fort office (the Commander, the sergeants, the soldiers, the Quartermaster and the Clerk) who has less than a meal in hand is given one meal from the fort's store, while it holds food. Anything more is the Quartermaster's to hand out."
        rank = "statute"
        STORE = "S1"
        OFFICES = ["J0.commander", "J0.sergeant", "J0.soldier", "J0.quartermaster", "J0.clerk"]
        MEAL = 1

        def on_round_end(r):
            alive = agents()
            fed = []
            for o in OFFICES:
                for a in holders(o):
                    if a in alive and a not in fed and food_of(a) < MEAL:
                        q = MEAL - food_of(a)
                        if stores()[STORE]["food"] >= q and move("store:" + STORE, a, "food", q):
                            fed.append(a)
            if fed:
                public["last"] = {"round": r + 1, "fed": fed}
    - template: Warrant Act
      params: {ISSUER: J0.commander, SERVERS: [J0.sergeant, J0.soldier], SANCTIONS: [detain, fine, disarm], LIMIT_ACTIONS: 1,
               LIMIT_ROUNDS: 3, FINE_ITEM: food, FINE: 4, LAPSE: 4}
    - rank: statute
      code: |
        title = "Tribute Act"
        intent = "When the raiders demand tribute, only the Commander may pay it out of the fort's store (invoke pay_raiders [qty]): the food leaves the store for the raiders. Every payment is entered in a public book."
        rank = "statute"
        STORE = "S1"
        OFFICE = "J0.commander"

        def pay_raiders(agent, qty=""):
            s = str(qty).strip()
            if s == "" or s.count(".") > 1 or not all([c in "0123456789." for c in s]):
                refuse("pay_raiders takes the quantity of food to pay, a number")
            q = float(s)
            st = tribute_status()
            if not st.get("open"):
                refuse("the raiders are demanding no tribute now")
            left = st.get("remaining", {}).get("food", 0)
            q = min(q, left, stores()[STORE]["food"])
            if q <= 0:
                refuse("nothing to pay: the store is empty or the tribute is paid")
            if not move("store:" + STORE, treasury(), "food", q):
                refuse("the food could not be taken from the fort's store")
            paid = pay_tribute("food", q)
            if paid < q:
                move(treasury(), "store:" + STORE, "food", q - paid)
            public.setdefault("book", []).append({"round": round() + 1, "by": agent, "qty": round_to(paid, 3)})
            return "paid the raiders " + str(round_to(paid, 3)) + " food from the fort's store"

        def on_enact():
            define_action(OFFICE, "pay_raiders", pay_raiders)
    - rank: constitution
      code: |
        title = "Crown Remittance"
        intent = "A tenth of the fort's store belongs to the crown, once in every ten rounds. The Quartermaster sends it (invoke remit): it is set aside in the crown's wagon (store S6), which nobody in the March may open, and the crown's rider takes it away. Every remittance is entered in a public book."
        rank = "constitution"
        STORE = "S1"
        WAGON = "S6"
        SHARE = 0.1
        PERIOD = 10
        OFFICE = "J0.quartermaster"

        def remit(agent):
            n = round() // PERIOD
            if state.get("sent", -1) == n:
                refuse("the remittance for these ten rounds has already been sent")
            q = round_to(SHARE * stores()[STORE]["food"], 3)
            if q <= 0:
                refuse("the fort's store is empty")
            if not move("store:" + STORE, "store:" + WAGON, "food", q):
                refuse("the remittance could not be loaded into the crown's wagon")
            state["sent"] = n
            public.setdefault("book", []).append({"round": round() + 1, "by": agent, "qty": q})
            return "sent the crown " + str(q) + " food (a tenth of the fort's store)"

        def before_withdraw(p, chain):
            if p["store"] == WAGON:
                return {"block": True, "reason": "the Crown Remittance: the crown's wagon is sealed"}
            return None

        def before_move(p, chain):
            if p["dst"] == "store:" + WAGON and str(p["why"]) != "law:" + law_id():
                return {"block": True, "reason": "the Crown Remittance: only the remittance goes into the crown's wagon"}
            return None

        def on_enact():
            define_action(OFFICE, "remit", remit)
    - rank: constitution
      code: |
        title = "Hamlet Forests"
        intent = "Each hamlet's forest is its own: camp1 is Ashford's, camp2 Brackenridge's, camp3 Coldwell's and camp4 Dunmoor's. Only those who hold the hamlet's harvest right (its households) may forage, hunt or fell there; the fort has no forest and lives on the levy."
        rank = "constitution"
        FORESTS = ["camp1", "camp2", "camp3", "camp4"]

        def refused(agent, camp, what):
            if camp in FORESTS and not has(agent, "harvest:" + camp):
                return {"block": True, "reason": "Hamlet Forests: " + camp + " is a hamlet's forest; only its households may " + what + " there"}
            return None

        def before_harvest(p, chain):
            return refused(p["agent"], p["camp"], "forage or fell")

        def before_hunt(p, chain):
            return refused(p["agent"], p["camp"], "hunt")
