  explicit:
    Roderick: {primary: Aim, params: {decisive: 30, text: "Hold the March for the crown and keep it at peace."}}
    Brannock: {primary: Aim, params: {decisive: 30, text: "Serve well, eat well, and live to go home."}}
    Hask: {primary: Aim, params: {decisive: 30, text: "Serve well, eat well, and live to go home."}}
