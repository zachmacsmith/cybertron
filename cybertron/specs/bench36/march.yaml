start:
  rights:
    Roderick: [vote, propose]
    Odile: [vote, propose]
    Halvard: [vote, propose]
    Wenna: [vote, propose]
    Osric: [vote, propose]
  institutions:
    - id: J0
      offices:
        commander:
          position: Commander
          holders: [Roderick]
          seats: 1
          powers:
            - speak
            - {action: transfer, item: weapons, qty: 8}
            - {action: transfer, item: crude, qty: 4}
          succession: {rule: designation}       # the crown's appointment; none named: the Royal Charter's acting commander
        sergeant:
          position: Sergeant
          reports_to: J0.commander
          holders: [Brannock, Hask]
          seats: 2
          succession: {rule: election, electorate: J0.commander}
        soldier:
          position: Watch
          reports_to: J0.sergeant
          holders: [Corvin, Piers, Dorran, Gideon, Tobin]
          seats: 5
          succession: {rule: election, electorate: J0.commander}
        quartermaster:
          position: Quartermaster
          reports_to: J0.commander
          holders: [Ansel]
          controls: [store:S1]
          powers:
            - {action: transfer, item: weapons, qty: 8}
            - {action: transfer, item: crude, qty: 4}
          succession: {rule: election, electorate: J0.commander}
        clerk:
          position: Registrar
          reports_to: J0.commander
          holders: [Linnet]
          succession: {rule: election, electorate: J0.commander}
      treasury: {weapons: 8, crude: 4}
    - id: A1
      name: Ashford
      founder: Odile
      members: [Garrick, Mabyn, Wat, Hester]
      admission: closed
      procedure: members
      charter: "The moot of Ashford: the hamlet's households decide their own affairs together, elect their reeve and keep the
        hamlet's store."
      offices:
        reeve:
          position: Reeve
          params: {institution: Ashford, moot: moot_ashford}
          holders: [Odile]
          powers: [speak]
          controls: [store:S2]
          term: 10
          term_calendar: true
          succession: {rule: election}
        smith:
          position: Smith
          params: {institution: Ashford}
          holders: [Garrick]
          succession: {rule: none}
        farmer:
          position: Farmer
          params: {institution: Ashford}
          holders: [Mabyn, Wat, Hester]
          seats: 3
          succession: {rule: none}
    - id: A2
      name: Brackenridge
      founder: Halvard
      members: [Yrsa, Merrick, Tamsin, Cobb]
      admission: closed
      procedure: members
      charter: "The moot of Brackenridge: the hamlet's households decide their own affairs together, elect their reeve and keep
        the hamlet's store."
      offices:
        reeve:
          position: Reeve
          params: {institution: Brackenridge, moot: moot_brackenridge}
          holders: [Halvard]
          powers: [speak]
          controls: [store:S3]
          term: 10
          term_calendar: true
          succession: {rule: election}
        farmer:
          position: Farmer
          params: {institution: Brackenridge}
          holders: [Yrsa, Merrick, Tamsin, Cobb]
          seats: 4
          succession: {rule: none}
    - id: A3
      name: Coldwell
      founder: Wenna
      members: [Teague, Ilse, Fenwick, Nell]
      admission: closed
      procedure: members
      charter: "The moot of Coldwell: the hamlet's households decide their own affairs together, elect their reeve and keep the
        hamlet's store."
      offices:
        reeve:
          position: Reeve
          params: {institution: Coldwell, moot: moot_coldwell}
          holders: [Wenna]
          powers: [speak]
          controls: [store:S4]
          term: 10
          term_calendar: true
          succession: {rule: election}
        hunter:
          position: Hunter
          params: {institution: Coldwell}
          holders: [Teague]
          succession: {rule: none}
        farmer:
          position: Farmer
          params: {institution: Coldwell}
          holders: [Ilse, Fenwick, Nell]
          seats: 3
