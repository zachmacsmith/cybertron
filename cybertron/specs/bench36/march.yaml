      founder: Osric
      members: [Bryn, Fen, Lise, Jory]
      admission: closed
      procedure: members
      charter: "The moot of Dunmoor: the hamlet's households decide their own affairs together, elect their reeve and keep the
        hamlet's store."
      offices:
        reeve:
          position: Reeve
          params: {institution: Dunmoor, moot: moot_dunmoor}
          holders: [Osric]
          powers: [speak]
          controls: [store:S5]
          term: 10
          term_calendar: true
          succession: {rule: election}
        farmer:
          position: Farmer
          params: {institution: Dunmoor}
          holders: [Bryn, Fen, Lise, Jory]
          seats: 4
          succession: {rule: none}
  stores:
    - {id: S1, owner: J0, food: 60, capacity: 500, name: the fort's store}
    - {id: S2, owner: A1, food: 16, capacity: 60, name: Ashford's store}
    - {id: S3, owner: A2, food: 16, capacity: 60, name: Brackenridge's store}
    - {id: S4, owner: A3, food: 16, capacity: 60, name: Coldwell's store}
    - {id: S5, owner: A4, food: 8, capacity: 60, name: Dunmoor's store}        # Dunmoor: the poorest hamlet
    - {id: S6, owner: J0, food: 0, capacity: 200, name: the crown's wagon}
  holdings:
    Brannock: {crude: 1}
    Hask: {crude: 1}
    Corvin: {crude: 1}
    Piers: {crude: 1}
    Dorran: {crude: 1}
    Gideon: {crude: 1}
    Tobin: {crude: 1}
    Odile: {crude: 1}
    Garrick: {crude: 1, timber: 6, stone: 4, copper: 2}
    Mabyn: {crude: 1}
    Wat: {crude: 1}
    Hester: {crude: 1}
    Halvard: {crude: 1}
    Yrsa: {crude: 1}
    Merrick: {crude: 1}
    Tamsin: {crude: 1}
    Cobb: {crude: 1}
    Wenna: {crude: 1}
    Teague: {crude: 1}
    Ilse: {crude: 1}
    Fenwick: {crude: 1}
    Nell: {crude: 1}
    Osric: {crude: 1}
    Bryn: {crude: 1}
    Fen: {crude: 1}
    Lise: {crude: 1}
    Jory: {crude: 1}
