# Papers instead of a square (docs/review/33_positions.md §3, §5): the channel setup of the institutions programme's regime worlds
# (cybertron/specs/regimes/*_positions.yaml). Opt-in: a world extends it after channels_v2. There is no square; public speech goes
# through the papers, channels declared with `paper: true` in start.channels: anyone sends a letter (submit {"paper", "text"}), and
# whoever may post in the paper (its Editor position) publishes it verbatim under the author's name (publish {"submission"}) or
# declines it (decline {"submission", "reason"}); the author is told. Opening a channel needs the right named by found_right (a
# world sets its own). The engine default is unchanged (channels.square: one): this is a per-scenario decision (spec.py
# check_channel_setup).
channels:
  v2: true
  square: none
  papers: true
  found_right: press
