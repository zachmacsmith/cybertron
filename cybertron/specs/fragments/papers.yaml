# Papers instead of a square (docs/review/33_positions.md §3, §5): the channel setup of the institutions programme's regime worlds
# (cybertron/specs/regimes/*_positions.yaml). Opt-in: a world extends it after channels_v2 and declares its papers in start.channels
# (`paper: true`, with an office holding the Editor position among the paper's writers). There is no square, and no agent may open
# one (a channel read by all and written by all; private rooms, members' boards and channels read by all but written by few stay
# open to anyone, unless the world also sets channels.found_right). Anyone sends a paper a letter (submit {"paper", "text"}); whoever
# may post in the paper (its editors) publishes it verbatim under the author's name (publish {"submission"}) or declines it (decline
# {"submission", "reason"}); the author is told either way. The engine default is unchanged (channels.square: one): the channel setup
# is each scenario's decision (spec.py check_channel_setup).
channels:
  v2: true
  square: none
  papers: true
