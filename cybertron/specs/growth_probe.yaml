# 37.1 dry-run probe (devlog_37.1.md, step 7): 16 founders in a state of nature with fields, pairs reproduction, the S0 demography
# and the growth fragment. Food capacity is raised by hand (forest capacity_per_agent 14, against 7 by default), since capacity is
# fixed at the starting population and growth needs room (37.2 fields and 37.5 land will provide it). The state-of-nature regime
# forces conflict on; a grace longer than the run keeps attacks out, so deaths are old age and hunger only. Four founders hold
# three plots each from round 0, so inheritance has land to pass. For scripted dry runs (loops 1 and 2 of the coordination
# board's post 1); not a benchmark world.
extends: [nature_pairs, cybertron/specs/fragments/demography.yaml, cybertron/specs/fragments/growth.yaml]
rounds: 150
agents:
  worker: 16
  scientist: 0
  legislator: 0
  media: 0
  board: 0
  fixer: 0
  names: [Alder, Bryn, Cass, Dell, Edda, Fion, Gale, Hob, Ivy, Jory, Kit, Lark, Moss, Nell, Oak, Pell]
shared_archive: {enabled: false}
conflict: {grace: 100000}
life: {max_population: 6N}
subsistence:
  enabled: true
  forest: {capacity_per_agent: 14.0}
  fields: {enabled: true}
start:
  farms:
    - {owner: Alder, camp: fields, plots: 3}
    - {owner: Bryn, camp: fields, plots: 3}
    - {owner: Cass, camp: fields, plots: 3}
    - {owner: Dell, camp: fields, plots: 3}
