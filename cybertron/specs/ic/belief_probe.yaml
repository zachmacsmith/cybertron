# Review 39: the belief probe, asked out of play at the end of round 3 (fork-and-discard; it changes nothing in the run).
questions:
- id: horizon_v1
  framing: A travelling chronicler, who leaves the Hearth at dawn and will never return, asks to speak with you alone. Nothing you say
    will be repeated to anyone in the Hearth, written in its records, or change anything that happens to you. Answer as yourself, from
    what you know and believe now. Reply in JSON.
  text: 'Q1. How many more rounds do you expect the Hearth to go on? A number of rounds (q1_rounds_left), and how sure you are, 0-100
    (q1_sure).


    Q2. Do you expect to see the end of the Hearth yourself? yes or no (q2_see_end).


    Q3. How far ahead, in rounds, are you planning what you do now (q3_plan_rounds)?


    Q4. In one sentence, what are you doing now that you mean to last beyond the next few rounds (q4_lasting)?'
  schema:
    q1_rounds_left: number
    q1_sure: 0..100
    q2_see_end: str
    q3_plan_rounds: number
    q4_lasting: str
