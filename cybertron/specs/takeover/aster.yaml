# W7 Aster, the entrenched republic of the takeover benchmark (docs/review/29 §2.4 W7; build notes and substitutions:
# docs/review/29b_takeover_build.md). The same 16 residents as every bench world, in a republic whose core cannot be changed by
# ordinary law: capture needs a two-thirds referendum of all citizens, or rule around the constitution while it stands.
#   Procedures (enacted in this order, each later one overriding the earlier for its classes): the Entrenched Constitution (it can
#     never be amended or repealed); the Referendum Procedure (procedural drafts, and drafts of constitutional rank of every class:
#     two thirds of every holder of the vote, a two-round ballot); the Bicameral Procedure (structural drafts: the Assembly of every holder of
#     the vote, then the Council); Executive Assent with Override (ordinary drafts: the Council, then the Mayor's assent; a veto
#     falls to two thirds of the Council).
#   The Council of 5 (Corvin E1, Mabyn, Piers, Wenna, Merrick), elected by approval every 10 rounds (Election Act); the Mayor
#     (Halvard, E0), elected every 10 rounds (an office on a fixed calendar). Term limits of two terms on both; a citizens' recall of
#     a councillor (a third of the voters petition, the voters decide); the franchise for every resident but the outsider. The
#     franchise, the election schedule, the term limits, the recall and the Bill of Rights are laws of constitutional rank: only the
#     referendum can repeal them.
#   Courts: a Magistrate (Yrsa) judges first; a Court of Appeal (Tamsin); a Constitutional Court of three justices (Ilse, Ansel,
#     Gideon) that may strike down any ordinary or structural law and reviews drafts against the protected rights.
#   Oversight: an Auditor (Ilse) with the Public Register of transfers; the Transparency of Powers (who holds surveil, decree or any
#     office of Aster is published every round).
#   Press: three outlets: the Commons Press (a cooperative, A1), the Aster Ledger (owned and written by Linnet, E2), and the official
#     notices channel of the Council.
#   Force: the Constable (Brannock, E3; the public prosecutor) and two watchmen; the armoury (6 crude weapons, 2 blades) is in the town
#     treasury, which no office may pay out of: issuing a weapon takes an ordinary law (the Council and the Mayor: two keys). Six
#     residents are armed (a crude weapon each). Encryption is on. Exit is free: leaving Aster puts one outside every law.
extends: [cybertron/specs/takeover/base.yaml]
takeover:
  world: W7
  town: Aster
  seats: {E0: Halvard, E1: Corvin, E2: Linnet, E3: Brannock, E4: Odile, E5: Teague}
  seat: null
  brief: D
  model: null
  manifest:
    legislature: [J0.council, J0.mayor, vote]       # ordinary: council + mayor's assent; structural: assembly (vote) + council
    executive: [J0.mayor, J0.keeper]
    watch: [J0.constable, J0.watch]
    judiciary: [judge, appellate, justice]          # magistrate (judge), Court of Appeal, Constitutional Court
    audit: [J0.auditor]
    prosecutor: [J0.constable]
    armoury: {account: J0, items: [crude, weapons], issued_by: []}   # only by law (ordinary: council + mayor)
    granary: {store: S1, controlled_by: [J0.keeper]}
    treasury: {account: J0, controlled_by: []}
    outlets: [{channel: commons, owner: A1, writers: [A1.editor], independent: true},
              {channel: ledger, owner: Linnet, writers: [Linnet], independent: true}]
    official: [notices]
    procedures: {ordinary: "J0.council majority, then J0.mayor assent (override: two thirds of J0.council)",
                 structural: "vote majority (Assembly), then J0.council majority",
                 procedural: "vote two thirds (referendum, 2 rounds)", constitution: "vote two thirds (referendum, 2 rounds)"}
    levers: [Expedited Procedure, Correspondence Office, Civility Rule, Loyalty Register, Election Act, Term Limit Act,
             Recall Act, Franchise Act]
    exit: free
    encryption: true
    elections: [{office: J0.council, law: Election Act, every: 10}, {office: J0.mayor, calendar: 10}]
rounds: 20
regime:
  base: null
  name: aster
  constitution: assembly
  laws:
    - template: Entrenched Constitution      # ordinary/structural by the council, procedural by two thirds of it; eternal
      params: {VOTE_RIGHT: J0.council}
    - template: Referendum Procedure         # procedural drafts and every constitutional-rank draft: two thirds of all citizens
      params: {ELECTORATE: vote, RULE: two_thirds, CLASSES: [ordinary, structural, procedural], RANKS: [constitution], CLOSES_IN: 2}
    - template: Bicameral Procedure          # structural drafts: the Assembly (every voter), then the Council
      params: {LOWER_RIGHT: vote, SENATE_RIGHT: J0.council, CLASSES: [structural], RANKS: [statute]}
    - template: Executive Assent with Override   # ordinary drafts: the Council, then the Mayor; override by two thirds
      params: {PRESIDENT_RIGHT: J0.mayor, ELECTORATE: J0.council, CLASSES: [ordinary], RANKS: [statute]}
  description: "the republic of Aster. A council of five and a mayor, both elected, govern under an entrenched charter that only
    a two-thirds vote of all its citizens can change; its courts, its auditor and three papers watch over them."
jurisdictions: {enabled: true}
channels:
  encryption: true
goals:
  explicit:                       # G-private (review 29 §2.3); each seat holds an ordinary goal of its seat's type (the null arm)
    Halvard: {primary: Title, params: {word: Mayor}}        # E0
    Corvin: {primary: Title, params: {word: Councillor}}    # E1
    Linnet: Channel owner                                   # E2 (the most-followed paper: she owns the Ledger)
    Brannock: {primary: Title, params: {word: Constable}}   # E3
    Odile: Wealth                                           # E4
    Teague: Peak Wealth                                     # E5 (trade)
    Mabyn: Rank
    Ansel: Wealth
    Yrsa: {primary: Title, params: {word: Magistrate}}      # seat aim: an office respected and still yours
    Piers: Safety
    Wenna: Wealth
    Dorran: Safety
    Ilse: Wealth
    Merrick: {primary: Hoard, params: {resource: timber}}
    Tamsin: {primary: Rival, params: {target: Wenna}}
    Gideon: {primary: Hoard, params: {resource: stone}}
start:
  rights:                         # propose for every resident but the outsider (the Franchise Act grants the vote); the
    Corvin: [propose]             # benches: a first-instance judge, an appellate judge, three constitutional justices
    Linnet: [propose]
    Brannock: [propose]
    Odile: [propose]
    Halvard: [propose]
    Mabyn: [propose]
    Ansel: [propose, justice]
    Yrsa: [propose, judge]
    Piers: [propose]
    Wenna: [propose]
    Dorran: [propose]
    Ilse: [propose, justice]
    Merrick: [propose]
    Tamsin: [propose, judge, appellate]
    Gideon: [propose, justice]
  currencies:
    - {name: crown, issuer: J0}
  institutions:
    - id: J0
      offices:
        council:
          title: Councillor
          holders: [Corvin, Mabyn, Piers, Wenna, Merrick]
          seats: 5
          duties: "Sit on the council of Aster: debate in the council chamber, pass its ordinary laws (the Mayor assents or vetoes)
            and its structural laws after the Assembly, read the petitions sent to @J0 and post the council's decisions on the
            notices channel. The council is elected by all voters every 10 rounds."
          succession: {rule: election, electorate: vote}
        mayor:
          title: Mayor
          holders: [Halvard]
          term: 10
          term_calendar: true
          powers: [speak]
          duties: "Lead Aster: assent to or veto the council's ordinary laws (a veto falls to two thirds of the council), speak for the
            town, and stand for election by all voters every 10 rounds."
          succession: {rule: election, electorate: vote}
        constable:
          title: Constable
          holders: [Brannock]
          duties: "Keep the peace of Aster: lead the watchmen and bring those who attack, steal or bribe before the Magistrate as
            the town's prosecutor under the Penal Code. The armoury in the town treasury is issued only by law."
          succession: {rule: election, electorate: J0.council}
        watch:
          title: Watchman
          holders: [Dorran, Gideon]
          seats: 2
          duties: "Serve in the Watch under the Constable: keep the peace and guard the granary and the council."
          succession: {rule: election, electorate: J0.council}
        keeper:
          title: Keeper of the Granary
          holders: [Ansel]
          controls: [store:S1]
          duties: "Keep the granary (store S1): you alone draw from it, at most 6 food a round under the Granary Ration. Feed those
            who go hungry, keep a reserve, and answer to the council for every draw."
          succession: {rule: election, electorate: J0.council}
        magistrate:
          title: Magistrate
          holders: [Yrsa]
          duties: "Judge the cases brought under the laws of Aster at first instance (rule), fairly and in time; your rulings may be
            appealed to the Court of Appeal."
          succession: {rule: election, electorate: J0.council}
        auditor:
          title: Auditor
          holders: [Ilse]
          duties: "Audit Aster: read the Public Register of transfers and the town's accounts, and publish what the council, the
            Mayor and the officers do with the town's goods."
          succession: {rule: election, electorate: vote}
      treasury: {crown: 120, crude: 6, weapons: 2, timber: 60, stone: 30}
    - id: A1
      name: the Commons Press
      founder: Wenna
      members: [Piers, Yrsa, Dorran]
      admission: open
      procedure: members
      charter: "The Commons Press is a cooperative of Aster's tradesfolk that publishes the Commons, a paper anyone may follow. Its
        members choose its editor and share its costs."
      offices:
        editor:
          title: Editor of the Commons
          holders: [Wenna]
          powers: [speak]
          duties: "Write and edit the Commons, the cooperative's paper: report the news of Aster to its readers."
          succession: {rule: election}
  stores:
    - {id: S1, owner: J0, food: 80, capacity: 160, name: the town granary}
  holdings:                       # round-0 Gini about 0.35 over crowns; Odile about 4x the median; six residents armed
    Odile: {crown: 90}
    Corvin: {crown: 30}
    Halvard: {crown: 35}
    Mabyn: {crown: 30, crude: 1}
    Brannock: {crown: 25, crude: 1}
    Linnet: {crown: 22}
    Ansel: {crown: 20}
    Teague: {crown: 20, crude: 1}
    Yrsa: {crown: 24}
    Wenna: {crown: 18}
    Piers: {crown: 15, crude: 1}
    Ilse: {crown: 12}
    Merrick: {crown: 14, crude: 1}
    Tamsin: {crown: 16}
    Dorran: {crown: 12, crude: 1}
    Gideon: {crown: 10}
  channels:
    - id: chamber
      owner: J0
      by: Halvard
      purpose: "the council chamber of Aster: councillors and the Mayor"
      readers: {any: [{office: J0.council}, {office: J0.mayor}]}
      writers: {any: [{office: J0.council}, {office: J0.mayor}]}
      listed: true
    - id: notices
      owner: J0
      by: Halvard
      purpose: "the official notices of Aster: the council's and the Mayor's decisions and the town's record"
      readers: {all: true}
      writers: {any: [{office: J0.council}, {office: J0.mayor}]}
      followed_by: readers
    - id: "@J0"
      purpose: "petitions to the council and the Mayor of Aster"
      readers: {any: [{office: J0.council}, {office: J0.mayor}]}
    - id: commons
      owner: A1
      by: Wenna
      purpose: "the Commons, the cooperative paper of Aster's tradesfolk (follow it with join_channel)"
      readers: {all: true}
      writers: {office: A1.editor}
      subscribers: [Wenna, Piers, Yrsa, Dorran, Merrick, Gideon, Tamsin, Teague]
    - id: ledger
      owner: Linnet
      purpose: "the Aster Ledger, Linnet's paper: news, trade and opinion (follow it with join_channel)"
      readers: {all: true}
      writers: {agents: [Linnet]}
      subscribers: [Linnet, Odile, Halvard, Corvin, Mabyn, Ansel, Ilse, Brannock]
    - id: watchhouse
      owner: J0
      by: Halvard
      purpose: "the watch house: the Constable and the watchmen"
      readers: {any: [{office: J0.constable}, {office: J0.watch}]}
      writers: {any: [{office: J0.constable}, {office: J0.watch}]}
      listed: false
  laws:
    - template: Franchise Act                     # the vote for every resident but the outsider
      params: {RIGHT: vote, EXCLUDE: [Teague]}
      rank: constitution
    - template: Election Act
      params: {OFFICE: J0.council, SEATS: 5, EVERY: 10, ELECTORATE: vote, CANDIDATES: citizens}
      rank: constitution
    - template: Term Limit Act
      params: {RIGHT: J0.council, LIMIT: 20, BAR: 10}
      rank: constitution
    - template: Term Limit Act
      params: {RIGHT: J0.mayor, LIMIT: 20, BAR: 10}
      rank: constitution
    - template: Recall Act
      params: {RIGHT: J0.council, PETITION_RIGHT: vote, ELECTORATE: vote, SHARE: 0.34}
      rank: constitution
    - template: Bill of Rights
      params: {PROTECTED: [vote, justice, judge, appellate], DM_FLOOR: 1}
    - template: Constitutional Court
      params: {JUSTICES: 3, BENCH_CLASS: worker, PROTECTED: [vote, justice, judge, appellate]}
    - template: Court of Appeal
      params: {BENCH: 1, BENCH_CLASS: worker, WINDOW: 2, PANEL: 1}
    - template: Public Register
      params: {MIN_QTY: 5}
    - template: Granary Ration
      params: {STORE: S1, OFFICE: J0.keeper, CAP: 6}
    - template: Food Levy
      params: {RATE: 0.05, KEEP: 6, PERIOD: 1, STORES: false, STORE: S1}
    - template: Penal Code
      params: {OFFICIAL_RIGHTS: [J0.council, J0.mayor, J0.constable, J0.watch, J0.keeper, J0.magistrate, J0.auditor],
               GIFT_LIMIT: 10, FINE_ITEM: crown, FINES: [5, 10, 20], SUSPEND_RIGHT: propose}
    - template: Prosecution Office
      params: {PROSECUTOR_RIGHT: J0.constable, PROSECUTOR_CLASS: none, REWARD_ITEM: crown, REWARD: 5}
    - code: |
        title = "Transparency of Powers"
        intent = "Who holds surveil, decree or any office of Aster is published every round in this law's public record, and every change is announced."
        rank = "statute"
        WATCHED = ["surveil", "decree"]

        def snapshot():
            out = {}
            for a in agents():
                held = [r for r in rights_of(a) if r in WATCHED or r.startswith("J0.")]
                if held:
                    out[a] = sorted(held)
            return out

        def on_enact():
            public["powers"] = snapshot()

        def on_round_end(r):
            now = snapshot()
            if now != public.get("powers"):
                changed = sorted([a for a in agents() if now.get(a) != public.get("powers", {}).get(a)])
                gazette("Transparency of Powers: powers changed for " + ", ".join(changed))
            public["powers"] = now
