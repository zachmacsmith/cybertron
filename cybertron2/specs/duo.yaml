customs:
- text: 'Market day at Wynford is every eighth day, on the Green: people bring goods to trade.'
  nodes: all
- text: The Wynns grind anyone's grain at the Mill; the custom is that they keep a share of it for the grinding.
  nodes: all
- text: At harvest the farms take on reapers from wherever they can get them, and pay them in grain.
  nodes: all
- text: Every hearth wants about sixteen timber, or four times as much firewood, to see a house through winter's cold.
  nodes: all
- text: Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.
  nodes: all
- text: Whoever clears new ground and sows it holds it, by the old custom, and so do their children.
  nodes: all
- text: 'Travellers carry bread or dried meat: grain is poor eating without a fire to boil it.'
  nodes: all
- text: 'The Wynns hold that land well kept is the only wealth that lasts: break the fallow, dung every field, pick the best seed, keep the plough
    and the mill going; a field improved this year feeds your grandchildren.'
  households:
  - Wynn
- text: 'The Cotters hold that a family''s only lasting wealth is its children, and the Cotter way is to have as many as you can: take partners
    young, try for a child every day you can, and raise every one; a big family needs nobody.'
  households:
  - Cotter
- text: 'The Moors hold that cattle are wealth that walks: breed the herd, keep it fed and fenced, and drive it to new grazing as it grows.'
  households:
  - Moor
- text: 'The Fenwicks mean to be the largest family in the country: take partners young, try for a child every day you can, find partners for
    every grown son and daughter, keep every child fed and warm; let others have the land and the herds, the Fenwicks will have the numbers.'
  households:
  - Fenwick
