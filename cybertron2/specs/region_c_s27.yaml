customs:
- text: 'Market day at Millford is every fourth day, on the Square: people bring goods there to trade, and the merchants buy and sell.'
  nodes: all
- text: The Millers grind for anyone who brings grain to the Mill; the custom is that they keep a share of the grain for the grinding.
  nodes: all
- text: At harvest the farms take on reapers from wherever they can get them, and pay them in grain.
  nodes: all
- text: The Bell at Millford gives travellers a bed and a meal for a price.
  nodes: all
- text: Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.
  nodes: all
- text: 'Travellers carry bread or dried meat: grain is no use without a fire to boil it.'
  nodes: all
- text: Every hearth wants about twelve timber to see a house through the six nights of winter's cold.
  nodes: all
- text: 'In Ashwood they say: whoever opens a way into new country shares it, and those who settle there owe the finder a share of its first harvest.'
  nodes:
  - ashwood
- text: Old people say there was a broad valley of black soil somewhere west along the river from Millford, never ploughed.
  nodes:
  - millford
  - barleyfield
- text: Hunters say deer come down in winter from open moor somewhere north of the wood, along a deer path nobody follows.
  nodes:
  - ashwood
- text: Old people say there was fine stone up the sheep track above Coppergate, past the grey crags, but nobody living has been.
  nodes:
  - coppergate
