# World 2 of the ladder (review 38.21): two villages a day apart on a cart track, and a wood nobody has explored. About 16 people.
# What it tests, on top of world 1: field works on both kinds of ground (D2-66), seed selection and master farmers (D2-64, D2-65),
# trade over a road with a handcart, the hand mill against an ox mill (D2-61), charcoal or timber for smelting (D4-46), camps,
# bedrolls and tents (D2-68), and an unexplored place found and told of (D4-47).
#   Wetham, in the valley bottom: good soil but wet; three households. The Marshes have drained two plots and know ditching; the
#     Reeves have not and do not; the Millers have an ox mill (dressed millstones and an ox) and grind for a share. Cattle on the
#     water meadows. No stone, little wood.
#   Highcombe, up the dale: thin hill fields; the Cragg household has terraced one field, knows terracing and selects its seed; a
#     quarry (stone for terraces, hearths and millstones) and a small smithy (the Smiths: copper tools from bought copper, no ore
#     here). Wood on the scarp. Little grain.
#   The Old Wood, beyond Highcombe by a forest path nobody follows: good timber, game, and a clearing; unexplored.
# Leverage: Wetham's grain against Highcombe's stone, tools and timber; the Marshes' ditching knowledge; the Millers' mill; the
# handcart (the Reeves'); the Smiths' anvil. Food binds through the winter at Highcombe.
