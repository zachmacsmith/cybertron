claims: []
customs:
- {text: "Every hearth wants about twelve timber to see a house through the six nights of winter's cold.", nodes: all}
- {text: "At harvest Ockley takes on reapers from wherever it can get them, and pays them in grain.", nodes: all}
- {text: "Travellers carry bread or dried meat: grain is no use without a fire to boil it.", nodes: all}
- {text: "Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.", nodes: all}
- {text: "Ockley has always had its timber from the Hollins folk, and paid them in grain.", nodes: all}
- {text: "In Hollins they say the wood has been cut over too long; the old men talk of deeper woods past the thorns and the ferns.", nodes: [hollins]}
- {text: "Hunters say the deer come up out of a fern hollow north of Hollin Wood, and that past it the oaks are bigger than any here, and past
    them again a valley with water in it.", nodes: [hollins]}
- {text: "Whoever clears new ground and sows it holds it, by the old custom, and so do their children.", nodes: all}
