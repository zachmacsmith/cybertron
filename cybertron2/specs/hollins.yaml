# Hollins (Zach, 24 Oct: "a single village in one node, and then a few huts out in one forest but they have a bunch of edges going
# out into other forests and the forests on their node will run out fast"; "some should be at least multiple nodes deep to see if
# they explore and then explore again"; "a smaller village that has relatively good resources for a long time to see if they grow
# and expand"), with children on (Package D, D2-138 to D2-153). 48 days from late summer through two winters (days 9 to 14 and
# 33 to 38). People, kin and their past are generated from the lines.
#   Ockley (the village, two households and a cottage): fields enough to feed it for the whole run and more (a granary of 160,
#     barley standing, a fallow field to sow), cattle; wood: a copse of 10 for three hearths that burn about 50 each over the run.
#   Hollins (the huts, a day's walk): two huts in Hollin Wood, 70 timber that does not grow back and a little game; no field.
#   The forest beyond, which nobody has been into, nobody living there (D4-47), three ways out of Hollins, each going deeper:
#     east  Blackthorn Wood (1) -> Thornend (1) -> Greyhanger (1, a high wood over a stony valley);
#     north Fern Hollow (1) -> Oakhanger (1, great oaks, an open glade of deep soil) -> the Beckside (1, a river valley of meadow
#           and good ground, the best land in the world);
#     west  Birchmoss (1) -> the Fen Edge (2, reeds, fish and wildfowl);
#     and a long way round between Blackthorn and Birchmoss (2). Each place shows only the ways out of it once one is there.
# Food is not what binds (Ockley has plenty, scenario_design.md §4); timber does, and room: the question is whether people have
# children, grow, and go further, settling new places as the near wood runs out.
