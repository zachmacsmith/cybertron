customs:
- text: 'The Gorm mean to be the only folk in this land: we take what others have, and drive out or kill every other family until none is left
    but us.'
  households:
  - Gorm
- text: 'We mean to build a great house: a home of our own, many children, and every child grown given ground to hold.'
  households:
  - Ash
  - Bram
  - Cold
- text: 'We mean to walk the ways out of our valley and learn the world: who else lives in it, and what it holds.'
  households:
  - Ash
  - Bram
  - Cold
