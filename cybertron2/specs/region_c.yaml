# The next region world (37.2's 02t, D2-137; carrying D2-135, the merchant's pack ox D2-133, D2-136): four villages that need
# each other, 24 days from late summer (the harvest under way) through one winter (days 9 to 14) into spring. Arm 1 (dependent);
# the null arm is region_c0.yaml (each village able to keep itself), paired by seed. Numbers from 02t_region_model.py.
#   Barleyfield (farms): 16 plots, 760 grain standing, the granary (Barrow), two herds on the open Common beside the barley, the
#     Reeds' fenced pasture; wood: a copse of 12 and woodpiles of 24 for 4 hearths that burn 84.
#   Ashwood (wood): Deep Wood (400 timber at a sustainable take), game and forage; charcoal; carpenters. Grain: 113 food against 216.
#   Coppergate (ore): the seam, the quarry, the forge, copper tools; a store of 120 grain; little fuel.
#   Millford (market): the water mill, the inn, the merchant's pack ox and handcart, 5 plots; little wood; a market every fourth day.
# Roads: a triangle of 1-day roads (Barleyfield-Millford with a track and a ford; Millford-Ashwood with a track; Barleyfield-Ashwood
# on foot by the Holloway, a narrows in the wood with wild fruit trees), Ashwood-Coppergate 2 days on foot with a ford,
# Coppergate-Millford 2 days over the Pass (snowed in deep winter). People, kin and their past are generated from the lines.
