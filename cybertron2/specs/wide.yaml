customs:
- {text: "Market day at Wynford is every eighth day, on the Green: people bring goods to trade.", nodes: all}
- {text: "The Wynns grind anyone's grain at the Mill; the custom is that they keep a share of it for the grinding.", nodes: all}
- {text: "At harvest the farms take on reapers from wherever they can get them, and pay them in grain.", nodes: all}
- {text: "Every hearth wants about sixteen timber, or four times as much firewood, to see a house through winter's cold.", nodes: all}
- {text: "Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.", nodes: all}
- {text: "Whoever clears new ground and sows it holds it, by the old custom, and so do their children.", nodes: all}
- {text: "Travellers carry bread or dried meat: grain is poor eating without a fire to boil it.", nodes: all}
- {text: "Old people say the drove road south along the river leads to fields their grandparents' grandparents farmed, left when a sickness came.", nodes: [wynford, westmere]}
- {text: "In Holloway they say the deer path north goes down into a dene of trees no axe has touched, and out onto high grazing beyond.", nodes: [holloway]}
- {text: "Shepherds say there is an old pass over the Tor to high grazing, closed by snow in winter.", nodes: [stannick, holloway]}
- {text: "The sheep track east from Stannick crosses scree where the stones are stained green.", nodes: [stannick]}
- {text: "Westmere folk tell of Ravensholm, west past the carr, where a rich family lived and died out; their hoard was never found.", nodes: [westmere, wynford]}
- {text: "Charcoal burners say an old holloway runs from the heart of the Weald to a lake nobody has seen.", nodes: [holloway, wynford]}
# each household's own way (D4-57)
- {text: "The Wynns hold that land well kept is the only wealth that lasts: break the fallow, dung every field, pick the best seed, keep the plough and the mill going; a field improved this year feeds your grandchildren.", households: [Wynn]}
- {text: "The Cotters hold that a family's only lasting wealth is its children: take partners young, have as many children as you can, as soon as you can, and raise every one; a big family needs nobody.", households: [Cotter]}
- {text: "The Ashes live by trade: cut and burn, carry and sell, keep your word and your accounts; a good bargain in every village is worth more than a field.", households: [Ashe]}
- {text: "The Rooks hold that the country is far bigger than anyone knows: go where no one has been, learn the ways, find the best land, and be the first to settle it.", households: [Rook]}
- {text: "The Moors hold that cattle are wealth that walks: breed the herd, keep it fed and fenced, and drive it to new grazing as it grows.", households: [Moor]}
- {text: "The Fenwicks mean to be the largest family in the country: take partners young, have a child as often as you can, keep every one fed and warm; let others have the land and the herds, the Fenwicks will have the numbers.", households: [Fenwick]}
- {text: "The Reeds were always the ones who went further, past the carr and over the hills; a Reed who never left the Holm has wasted a life.", households: [Reed]}
