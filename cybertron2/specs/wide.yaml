# The Wide Country (Zach, 24 Oct): "a few pretty small villages across a much larger interconnect of land types ... vary the models
# ... older Claude models versions of haiku and sonnets and opuses, tho each household should be the same model. Have some households
# with different customs, and some clearly with goals to explore while others clearly have goals to grow the largest families
# possible. Think about all the system we have built ... start with not too many agents and let it run for a lot longer (100+ days)".
#
# 120 days, seasons of 8 (a year of 32: four winters), lifespan 48, children on (low dial). Package F woods, seeded at about 60-80%
# of what each village's land gives back a year; the frontier is empty and rich.
#
# Four small villages on a river and the hills beside it, seven households, each with its own model and its own way:
#   Wynford (river valley; fields, the water mill, the market): the Wynns (improve the land; claude-opus-4-5) and the Cotters
#     (the largest family they can raise; claude-haiku-4-5)
#   Holloway (wooded hills; coppice, old forest, charcoal): the Ashes (trade; claude-sonnet-4-5) and the Rooks (explore and be first
#     to settle; claude-opus-5-5)
#   Stannick (moor edge; grazing, cattle, the quarry): the Moors (cattle: breed and graze further; claude-sonnet-4-6) and the
#     Fenwicks (the largest family in the country; claude-opus-4-7)
#   Westmere (fen edge): the Reeds (always the ones who went further; claude-haiku-5-5)
# Shared wild land known to all: the Weald (old forest between Wynford and Holloway), High Tor (moor and crag above Stannick).
# Eight places nobody has been, each with a reason to go: Riversmeet (old abandoned fields), the Saltings (marsh grazing), Deepdene
# (deep old forest), Coldharbour (high grazing, over the Tor pass, snowed in winter), Greystone (a copper seam), Wealdmere (the best
# land: lake fields; also by a hidden old way from the Weald), Alder Carr, and Ravensholm (a ruined steading whose hoard was never
# found: a cache hidden there). Dependence: Holloway's food and Stannick's and Westmere's grain come short of what they eat, Wynford's
# fuel and Westmere's; Wynford has the mill and the market.
name: wide
