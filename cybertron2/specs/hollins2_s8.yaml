customs:
- text: Every hearth wants about twelve timber to see a house through the six nights of winter's cold.
  nodes: all
- text: At harvest Ockley takes on reapers from wherever it can get them, and pays them in grain.
  nodes: all
- text: 'Travellers carry bread or dried meat: grain is no use without a fire to boil it.'
  nodes: all
- text: Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.
  nodes: all
- text: In Hollins they say the wood has been cut over too long; the old men talk of deeper woods past the thorns and the ferns.
  nodes:
  - hollins
- text: Hunters say the deer come up out of a fern hollow north of Hollin Wood, and that past it the oaks are bigger than any here, and past them
    again a valley with water in it.
  nodes:
  - hollins
- text: Whoever clears new ground and sows it holds it, by the old custom, and so do their children.
  nodes: all
- text: Ockley has always had its game and hides from the Hunts of Hollins, and paid them in grain.
  nodes: all
- text: 'The Thornes hold that land well kept is the only wealth that lasts: break the fallow, dung every field, pick the best seed, ditch the
    wet ground and keep the plough going; a field improved this year feeds your grandchildren.'
  households:
  - Thorne
- text: 'The Webbs hold that a house is as strong as its children: take a partner young, have children and raise them well, and send your grown
    sons and daughters out to clear ground and build houses of their own; a family that grows is still standing when others are gone.'
  households:
  - Webb
- text: 'The Hunts hold that the wood beyond the wood is where a family''s future lies: go further than anyone has gone, learn the ways and the
    places, make camps and huts where the game and the timber are good, and bring others after you.'
  households:
  - Hunt
