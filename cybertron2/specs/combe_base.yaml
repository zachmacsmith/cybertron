# Combe (designed 1 Nov from the ground up; cheap at the start, Zach: one couple, room to grow, for the first run of the belief-built morning message, review 38.40 §9): one family,
# the Hobbs, at Combe, who mean to grow; the land round them empty. Run it through the generator for the family:
#   python -m cybertron2.engine.generate cybertron2/specs/combe_base.yaml --seed 61 --out cybertron2/specs/combe.yaml
#
# Dependence by design (scenario_design §1), for a family that grows and splits:
#   Combe (home): the house, a small barley infield, the common and its cattle (the only plough team), a copse, rough moor. Feeds
#     the household as it is (capacity: checked in the dry run), not one twice its size: growth needs ground and beds.
#   Wenmoor (1 day down the valley, empty): a village the fever emptied; rich fallow bottoms, a damaged house to claim, and the
#     only mill, idle by the river (grinding: a chokepoint whoever holds it controls).
#   Holtwood (1 day, empty): old forest: timber for beds and rooms, game, forage.
#   Redscar (unexplored, a day past Holtwood): stone and a seam of copper ore; found only by going.
# A grown child who leaves to hold Wenmoor's bottoms needs Combe's oxen to plough; Combe needs Wenmoor's mill and Holtwood's timber.
