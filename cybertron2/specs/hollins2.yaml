# Hollins 2 (Zach, 24 Oct: "design a similar run to this one ... with a few households, and one having custom to explore and expand
# out, and another to have all the children expansion etc., and one to just improve and build out the farms"), on Package F
# (D2-156 to D2-161: woods by kind, firewood, fuel in heat, eating raw; seeded below what the land gives back a year) and Package D
# (children on). 48 days, lifespan 48 (a world setting, D2-153). Three households, each with its own way, held as a custom:
#   the Thornes (Ockley): improve the farms; the Webbs (Ockley): grow the family and send it out; the Hunts (the hut at Hollins, a
#   day into the wood): explore further and settle where the land is good.
# Ockley has a copse and a coppiced wood (the Hanger); Hollins a copse; beyond Hollins the forests of hollins.yaml, by kind.
