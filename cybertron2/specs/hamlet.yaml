# World 1 of the ladder (review 38.21): one hamlet, two farms at different levels, across a winter. About 8 people.
# What it tests: the farming stages (D4-38), soil worn and restored (D4-39), crops and the cold (D2-53), sowing and dibbling (D2-54),
# cattle by role, grazing, hay and breeding (D2-63, D4-41 to D4-45), field works on wet ground (D2-66), skill by practice (D2-52),
# grain at a lit fire and the hand mill (D2-60, D2-61), and the signs of each (D4-48).
#   The Thornes farm well (level 2): an ox team with a plough and harness, a bull, cows in milk, a grain/beans/fallow rotation,
#     a field rested last year, and the hay meadow. They know ploughing and milking.
#   The Ashbys farm with the hoe (level 1) on tired soil, and hold the Low Field, wet ground nobody has drained; old Ashby knows how
#     to lay out ditches, the Thornes do not. They have no beasts.
# Leverage (scenario_design.md §1): the Thornes hold the team, the bull and the hay; the Ashbys hold the wet field and the knowledge
# to drain it, and the wood. Food binds through the winter: what is not in store by the frost is not there.
