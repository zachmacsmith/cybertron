customs:
- {text: "Market day at Millford is every third day, on the Square: people bring goods there to trade, and the merchants buy and sell.", nodes: all}
- {text: "The Millers grind for anyone who brings grain to the Mill; the custom is that they keep a share of the grain for the grinding.", nodes: all}
- {text: "At harvest the farms take on reapers from wherever they can get them, and pay them in grain.", nodes: all}
- {text: "The Bell at Millford gives travellers a bed and a meal for a price.", nodes: all}
- {text: "Barley sown after the middle of autumn will not ripen before the frost; rye will stand the winter.", nodes: all}
- {text: "Travellers carry bread or dried meat: grain is no use without a fire to boil it.", nodes: all}
- {text: "Nobody goes up the sheep track above the Pass or the deer path out of Ashwood: nobody knows what is up there.", nodes: [the_pass, ashwood, coppergate]}
