# The first region (37.2's 02f §4) at the scale its economy needs (review 38.19): four villages and a pass, about 48 working people.
# Land, roads, buildings, herds, claims, customs and lines are written here; people, kin and their past are generated (D4-21).
#   Millford (market town, ~17): the mill, the smithy, the merchants' store and carts, the inn; no fields, almost no wood.
#   Barleyfield (farm village, ~15): the fields, the cattle, the granary; a landless cottage; no wood, no stone.
#   Ashwood (wood hamlet, ~9): the region's timber and game; carpenters who make carts; little food.
#   Coppergate (mining camp, ~8): the seam and the quarry, the forge; a large store of food, but not enough for the season; no wood.
#   The Pass: the short road from Coppergate to Millford, with no track: carts go round by Ashwood.
# Sizing (38.19, from the engine's numbers): food is limited by land, not labour (grain costs about 0.5 units a ration), so every
# village but Barleyfield lives on carried grain; a handcart on a track moves a unit a day's walk for 0.15-0.3 units, on foot 0.6-1.2,
# so the trade is the merchants' and goes by the tracks. Labour binds at the peaks: the harvest window (North Field takes about 60
# units of reaping in two days), the cold nights (2 timber a house) and the carrying. Copper tools pay there (reaping x1.5, felling x2);
# crude tools need stone, which only Coppergate has.
# Chokepoints (scenario_design.md §1): the granary and the fields, the timber, the stone and the seam, the smithy, the merchants' carts and
# coin, the track (the Pass has none).
