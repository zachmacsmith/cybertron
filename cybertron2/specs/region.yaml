# World 3 of the ladder (review 38.21): the first region (37.2's 02f §4, economy_plan.md) on the rebuilt engine with farming, cattle,
# field works, the mill ladder, camps and unexplored places. Four villages, a pass and two places nobody has explored; about 40
# working people. Land, roads, buildings, herds, claims, customs and lines are written here; people, kin and their past are generated.
#   Millford (market town, ~13): the water mill, a smithy, the merchants' store and handcarts, the inn; no fields, little wood.
#   Barleyfield (farm village, ~15): farms at every level. The Reeds plough with an ox team, rotate grain, beans and fallow, manure
#     and select their seed (level 3); the Barrows farm with hoe and weeding, know ditching and hold the granary (level 1-2); the Hales
#     farm tired soil and an undrained wet field (level 1); the Lowes have no land and no tools (level 0) and work for others.
#   Ashwood (~9): timber, game, charcoal; carpenters who make carts and ploughs; hides for harness.
#   Coppergate (~8): the seam, the quarry and a forge where the Moors smelt and make tools: the second smith (D2-57); a large store
#     of food, but not for the whole season.
#   The Pass: the short way from Coppergate to Millford, no track. Off it, unexplored, Grey Crag: a face of fine stone.
#   Off Ashwood, unexplored, the High Moor: open grazing and deer.
# Sizing (38.19, 38.21): food is limited by land; Millford, Ashwood and Coppergate live on Barleyfield's grain and Coppergate's
# store, carried; a handcart on a track moves grain for a fraction of what it costs on foot. Labour binds at the harvest window, the
# frost (winter from day 9), the cold nights and carrying. Chokepoints: the fields and the granary, the ox team and the bull, the mill,
# timber and charcoal, the seam and stone, two smiths, the carts and the track, the inn's beds.
