# The dependence null for region_c1 (02t §5, D2-137): the same people, land, roads and custom (paired by seed), but each village
# able to keep itself over the 48 days: woodlots at Barleyfield and Millford (200 timber) and Coppergate (130), more than two winters'
# hearths and the charcoal need; a field at Ashwood (4 plots, 160 standing, resown); a store at Coppergate of 640 grain (it has no
# field: 1.25 times what it eats); more barley at Millford (300, resown). Trade here is optional: cross-village flows in region_c1
# beyond these are what dependence produced.
base: cybertron2/specs/region_c1.yaml
